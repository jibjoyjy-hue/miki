<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK</title>
<style>
  *{box-sizing:border-box;margin:0;font-family:'Segoe UI',Tahoma,sans-serif}
  body{background:radial-gradient(circle at 20% 20%,#c9b8ff,transparent 50%),radial-gradient(circle at 80% 80%,#ffc6e0,transparent 50%),#efeaff;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .phone{width:375px;height:780px;background:linear-gradient(180deg,#faf8ff,#fff);border-radius:44px;border:10px solid #1c1b29;box-shadow:0 30px 70px rgba(80,50,180,.35);overflow:hidden;position:relative}
  .phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#1c1b29;border-radius:0 0 16px 16px;z-index:5}
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;z-index:0}
  .b1{width:200px;height:200px;background:#a58bff;top:-60px;right:-60px}
  .b2{width:180px;height:180px;background:#ff9ccc;bottom:-60px;left:-60px}
  .screen{display:none;height:100%;flex-direction:column;justify-content:center;gap:22px;padding:50px 26px 30px;position:relative;z-index:1}
  .screen.active{display:flex;animation:in .4s ease}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .title{text-align:center;margin-bottom:6px}
  .title h1{font-size:26px;color:#2b2a3d}.title p{color:#8a88a0;margin-top:4px;font-size:14px}
  .choice{flex:1;max-height:210px;border:none;border-radius:26px;color:#fff;font-size:24px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:.25s;position:relative;overflow:hidden}
  .choice small{font-size:13px;font-weight:400;opacity:.85}
  .choice .ic{width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:40px;backdrop-filter:blur(6px)}
  .admin{background:linear-gradient(135deg,#6a4cff,#a46bff);box-shadow:0 14px 28px rgba(106,76,255,.4)}
  .user{background:linear-gradient(135deg,#ff6b9a,#ffa36b);box-shadow:0 14px 28px rgba(255,107,154,.4)}
  .choice:hover{transform:translateY(-4px) scale(1.02)}
  .choice:active{transform:scale(.98)}
  h2{text-align:center;color:#2b2a3d;font-size:24px}
  .lock{width:84px;height:84px;margin:0 auto;border-radius:26px;background:linear-gradient(135deg,#6a4cff,#a46bff);display:grid;place-items:center;font-size:40px;box-shadow:0 12px 24px rgba(106,76,255,.4)}
  input{width:100%;padding:16px 18px;font-size:18px;border:2px solid #e3dcff;background:#fff;border-radius:16px;outline:none;transition:.2s;text-align:center}
  input:focus{border-color:#7c5cff;box-shadow:0 0 0 4px rgba(124,92,255,.15)}
  .btn{padding:16px;font-size:18px;font-weight:700;border:none;border-radius:16px;background:linear-gradient(135deg,#6a4cff,#a46bff);color:#fff;cursor:pointer;box-shadow:0 10px 20px rgba(106,76,255,.35);transition:.2s}
  .btn:hover{transform:translateY(-2px)}
  .back{background:none;border:none;color:#7c5cff;font-size:15px;cursor:pointer;font-weight:600}
  .err{color:#e5484d;text-align:center;min-height:20px;font-size:14px}
  .ok{text-align:center;font-size:26px;font-weight:700;color:#2b2a3d}
  .ok .tick{width:110px;height:110px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#22c58b,#6be3b0);display:grid;place-items:center;font-size:56px;color:#fff;box-shadow:0 14px 30px rgba(34,197,139,.45);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  #main,#custMain{padding:0;gap:0;justify-content:flex-start}
  .pages{flex:1;position:relative}
  .page{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-top:30px}
  .page.on{display:flex;animation:in .35s ease}
  #p-home{justify-content:flex-start;align-items:stretch;padding:56px 20px 0;gap:16px}
  .menu{display:flex;align-items:center;gap:16px;text-align:left;border:none;border-radius:24px;padding:22px 20px;color:#fff;cursor:pointer;transition:.25s}
  .menu b{display:block;font-size:20px}.menu small{opacity:.85;font-size:13px}
  .menu .mic{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:28px;flex:none}
  .menu.add{background:linear-gradient(135deg,#6a4cff,#a46bff);box-shadow:0 12px 24px rgba(106,76,255,.35)}
  .menu.status{background:linear-gradient(135deg,#22c58b,#5fd8b0);box-shadow:0 12px 24px rgba(34,197,139,.35)}
  .menu:hover{transform:translateY(-3px)}
  .user-lock{background:linear-gradient(135deg,#ff6b9a,#ffa36b);box-shadow:0 12px 24px rgba(255,107,154,.4)}
  .hbox{display:flex;flex-direction:column;gap:16px}
  .svhead{display:flex;justify-content:space-between;align-items:center}
  #reqList{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto}
  .req{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 14px rgba(80,50,180,.1)}
  .req-row{display:flex;align-items:center;gap:12px}
  .req .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff6b9a,#ffa36b);color:#fff;font-weight:700;display:grid;place-items:center}
  .req .rt{flex:1}.req b{display:block;color:#2b2a3d;font-size:15px}.req small{color:#9a98ad}
  .badge{background:#fff3d6;color:#c58a00;font-size:12px;font-weight:600;padding:5px 10px;border-radius:12px}
  .empty{text-align:center;color:#9a98ad;padding:40px 0}
  #c-home{justify-content:flex-start;align-items:stretch;padding:56px 20px 0}
  #c-home .hbox{max-height:620px;overflow-y:auto;padding-bottom:12px}
  #myQuests{display:flex;flex-direction:column;gap:10px}
  .greet small{color:#8a88a0}.greet h2{text-align:left;font-size:24px}
  #p-quest{justify-content:flex-start;align-items:stretch;padding:56px 20px 0}
  #p-quest .hbox{max-height:620px;overflow-y:auto;padding-bottom:12px}
  #questList,#custList{display:flex;flex-direction:column;gap:10px}
  .fl{width:100%;padding:13px 16px;font-size:16px;border:2px solid #e3dcff;background:#fff;border-radius:14px;outline:none;font-family:inherit;resize:none}
  .fl:focus{border-color:#7c5cff;box-shadow:0 0 0 4px rgba(124,92,255,.15)}
  .lbl{color:#2b2a3d;font-size:15px}
  .mini{border:none;background:#efeaff;color:#6a4cff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:10px;margin-left:6px;cursor:pointer}
  .cust{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:11px 14px;box-shadow:0 3px 10px rgba(80,50,180,.08);cursor:pointer;color:#2b2a3d}
  .cust input{width:20px;height:20px;accent-color:#7c5cff}
  .qcard{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 14px rgba(80,50,180,.1)}
  .qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .qtop b{color:#2b2a3d}
  .credit{background:#fff3d6;color:#c58a00;font-weight:700;font-size:13px;padding:4px 10px;border-radius:12px;white-space:nowrap}
  .qcard p{color:#6f6d85;font-size:13px;margin:6px 0}
  #claimList{display:flex;flex-direction:column;gap:10px}
  .qcard.claim{border:2px solid #ffe3a3}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts button,.claim-btn{border:none;border-radius:12px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;color:#fff}
  .ok-btn{background:#22c58b;flex:1}.no-btn{background:#e5484d;flex:1}
  .claim-btn{background:linear-gradient(135deg,#6a4cff,#a46bff)}
  .claim-btn:disabled{opacity:.6}
  .qact{margin-top:10px}
  .badge.got{background:#dff7ec;color:#16915f}.badge.rej{background:#fde4e4;color:#d23b40}
  .wallet{background:linear-gradient(135deg,#6a4cff,#a46bff);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 10px 22px rgba(106,76,255,.35)}
  .wallet small{opacity:.85}.wallet h1{font-size:34px;margin-top:4px}
  .who{font-size:12px;color:#9a98ad;margin-top:8px}
  .chip{display:inline-block;background:#efeaff;color:#6a4cff;font-weight:600;padding:3px 9px;border-radius:10px;margin:3px 4px 0 0}
  .ok .sub{font-size:15px;font-weight:400;color:#8a88a0;margin-top:8px}
  .page .pic{width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,#6a4cff,#a46bff);display:grid;place-items:center;font-size:48px;box-shadow:0 14px 28px rgba(106,76,255,.35)}
  .tabbar{margin:0 14px 14px;height:68px;background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(80,50,180,.18);display:flex;justify-content:space-around;align-items:center}
  .tabbar button{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:#9a98ad;transition:.2s}
  .tabbar button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6;transition:.2s}
  .tabbar button.on{color:#6a4cff}
  .tabbar button.on i{filter:none;opacity:1;transform:translateY(-2px)}
  .toast{position:absolute;top:28px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(34,197,139,.95);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.15);opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone">
  <div class="blob b1"></div><div class="blob b2"></div>

  <div class="screen active" id="select">
    <div class="title"><h1>ยินดีต้อนรับ</h1><p>เลือกประเภทผู้เข้าใช้งาน</p></div>
    <button class="choice admin" onclick="show('adminLogin')"><div class="ic">🛠️</div>แอดมิน<small>สำหรับเจ้าของร้าน</small></button>
    <button class="choice user" onclick="show('userPage')"><div class="ic">👤</div>ผู้ใช้<small>สำหรับลูกค้า</small></button>
  </div>

  <div class="screen" id="adminLogin">
    <div class="lock">🔐</div>
    <h2>เข้าสู่ระบบแอดมิน</h2>
    <input id="pw" type="text" placeholder="พิมพ์ข้อความ" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="err"></div>
    <button class="btn" onclick="login()">ตกลง</button>
    <button class="back" onclick="show('select')">← กลับ</button>
  </div>

  <div class="screen" id="adminOk">
    <div class="ok"><div class="tick">✓</div>เข้าสู่ระบบเรียบร้อย</div>
  </div>

  <div class="screen" id="main">
    <div class="pages">
      <div class="page on" id="p-home">
        <div id="homeMenu" class="hbox">
          <button class="menu add" onclick="addCustomer()"><div class="mic">➕</div><div><b>เพิ่มลูกค้า</b><small>บันทึกลูกค้าใหม่</small></div></button>
          <button class="menu status" onclick="openStatus()"><div class="mic">📊</div><div><b>ดูสถานะ</b><small>ตรวจสอบสถานะลูกค้า</small></div></button>
        </div>
        <div id="statusView" class="hbox" style="display:none">
          <div class="svhead"><button class="back" onclick="closeStatus()">← กลับ</button><h2>สถานะ</h2><span style="width:50px"></span></div>
          <div id="reqList"></div>
        </div>
      </div>
      <div class="page" id="p-quest">
        <div id="questMain" class="hbox">
          <div class="svhead"><span style="width:50px"></span><h2>Quest</h2><span style="width:50px"></span></div>
          <button class="btn" onclick="openQuestForm()">＋ เพิ่มภารกิจ</button>
          <div id="claimList"></div>
          <div id="questList"></div>
          <div id="approvedClaimList" style="display:flex;flex-direction:column;gap:10px"></div>
        </div>
        <div id="questForm" class="hbox" style="display:none">
          <div class="svhead"><button class="back" onclick="closeQuestForm()">← กลับ</button><h2>เพิ่มภารกิจ</h2><span style="width:50px"></span></div>
          <input id="qTitle" type="text" placeholder="รายการ" class="fl">
          <textarea id="qDesc" placeholder="คำอธิบาย" rows="3" class="fl"></textarea>
          <input id="qCredit" type="number" min="0" placeholder="เครดิตที่ได้" class="fl">
          <div class="svhead"><b class="lbl">ส่งให้ลูกค้า</b><span><button class="mini" onclick="toggleAll(true)">เลือกทั้งหมด</button><button class="mini" onclick="toggleAll(false)">ล้าง</button></span></div>
          <div id="custList"></div>
          <div class="err" id="qErr"></div>
          <button class="btn" id="qSave" onclick="saveQuest()">บันทึกภารกิจ</button>
        </div>
      </div>
      <div class="page" id="p-gift"><div class="pic">🎁</div><h2>Gift</h2></div>
      <div class="page" id="p-shop"><div class="pic">🛍️</div><h2>Shop</h2></div>
    </div>
    <div class="tabbar">
      <button class="on" data-tab="home" onclick="tab('home')"><i>🏠</i>Home</button>
      <button data-tab="quest" onclick="tab('quest')"><i>📜</i>Quest</button>
      <button data-tab="gift" onclick="tab('gift')"><i>🎁</i>Gift</button>
      <button data-tab="shop" onclick="tab('shop')"><i>🛍️</i>Shop</button>
    </div>
  </div>

  <div class="screen" id="userPage">
    <div class="lock user-lock">👤</div>
    <h2>สมัครแอคเคานต์</h2>
    <input id="uname" type="text" placeholder="ใส่ชื่อของคุณ" onkeydown="if(event.key==='Enter')sendRequest()">
    <div class="err" id="uerr"></div>
    <button class="btn" id="sendBtn" onclick="sendRequest()">ส่งคำขอ</button>
    <button class="back" onclick="show('select')">← กลับ</button>
  </div>

  <div class="screen" id="userSent">
    <div class="ok"><div class="tick">✓</div><span id="sentTitle">ส่งคำขอเรียบร้อย</span><p class="sub" id="waitNotice">รอแอดมินอนุมัติ</p></div>
    <button class="back" onclick="cancelWait()">← กลับหน้าแรก</button>
  </div>

  <div class="screen" id="custMain">
    <div class="pages">
      <div class="page on" id="c-home">
        <div class="hbox">
          <div class="greet"><small>สวัสดี 👋</small><h2 id="custName"></h2></div>
          <div class="wallet"><small>เครดิตของฉัน</small><h1>🪙 <span id="myCredit">0</span></h1></div>
          <b class="lbl">ภารกิจของฉัน</b>
          <div id="myQuests"></div>
        </div>
      </div>
      <div class="page" id="c-chat"><div class="pic">💬</div><h2>Chat</h2></div>
      <div class="page" id="c-trade"><div class="pic">🔄</div><h2>Trade</h2></div>
      <div class="page" id="c-shop"><div class="pic">🛍️</div><h2>Shop</h2></div>
    </div>
    <div class="tabbar">
      <button class="on" data-tab="home" onclick="ctab('home')"><i>🏠</i>Home</button>
      <button data-tab="chat" onclick="ctab('chat')"><i>💬</i>Chat</button>
      <button data-tab="trade" onclick="ctab('trade')"><i>🔄</i>Trade</button>
      <button data-tab="shop" onclick="ctab('shop')"><i>🛍️</i>Shop</button>
    </div>
  </div>
</div>
<script>
  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('err').textContent='';
    document.getElementById('pw').value='';
    document.getElementById('uerr').textContent='';
    if(id==='userPage') document.getElementById('uname').value='';
  }
  function showToast(msg){
    let t=document.getElementById('appToast');
    if(!t){
      t=document.createElement('div');
      t.id='appToast';
      t.className='toast';
      document.querySelector('.phone').appendChild(t);
    }
    t.textContent=msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
  }
  let sending=false;
  let checkPollTimer=null;
  function cancelWait(){
    clearInterval(checkPollTimer);
    show('select');
  }
  async function sendRequest(){
    if(sending) return;
    const name=document.getElementById('uname').value.trim();
    if(!name){
      document.getElementById('uerr').textContent='กรุณาใส่ชื่อ';
      return;
    }
    sending=true;
    const btn=document.getElementById('sendBtn');
    btn.disabled=true; btn.textContent='กำลังส่ง...';
    document.getElementById('uerr').textContent='';
    try{
      const r=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
      if(!r.ok) throw 0;
      const data=await r.json();
      document.getElementById('custName').textContent=name;

      if(data.status==='approved'){
        show('custMain');
        loadMyQuests();
        return;
      }
      if(data.status==='rejected'){
        document.getElementById('uerr').textContent='คำขอของคุณถูกปฏิเสธ กรุณาติดต่อแอดมิน';
        return;
      }

      document.getElementById('sentTitle').textContent='ส่งคำขอเรียบร้อย';
      document.getElementById('waitNotice').innerHTML='รอแอดมินอนุมัติ...<br><small style="color:#7c5cff;font-size:13px;display:block;margin-top:6px">ระบบจะเข้าสู่หน้าหลักอัตโนมัติเมื่อแอดมินกดอนุมัติ</small>';
      show('userSent');
      clearInterval(checkPollTimer);
      checkPollTimer=setInterval(async()=>{
        if(!document.getElementById('userSent').classList.contains('active')){
          clearInterval(checkPollTimer);
          return;
        }
        try{
          const c=await (await fetch('/api/requests/check?name='+encodeURIComponent(name),{cache:'no-store'})).json();
          if(c.exists && c.status==='approved'){
            clearInterval(checkPollTimer);
            document.getElementById('waitNotice').innerHTML='<b style="color:#22c58b">✓ ได้รับการอนุมัติแล้ว! กำลังเข้าสู่ระบบ...</b>';
            setTimeout(()=>{ show('custMain'); loadMyQuests(); },600);
          } else if(c.exists && c.status==='rejected'){
            clearInterval(checkPollTimer);
            document.getElementById('waitNotice').innerHTML='<b style="color:#e5484d">✕ คำขอถูกปฏิเสธ</b>';
          }
        }catch(e){}
      },2000);
    }catch(e){
      document.getElementById('uerr').textContent='ส่งไม่สำเร็จ ลองใหม่อีกครั้ง';
    }finally{
      sending=false; btn.disabled=false; btn.textContent='ส่งคำขอ';
    }
  }
  let statusTimer=null;
  async function loadStatus(){
    const box=document.getElementById('reqList');
    let list=[];
    try{ list=(await (await fetch('/api/requests',{cache:'no-store'})).json()).reverse(); }
    catch(e){ box.innerHTML='<div class="empty">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>'; return; }
    box.innerHTML=list.length?'':'<div class="empty">ยังไม่มีคำขอ</div>';
    list.forEach(r=>{
      const d=document.createElement('div');
      d.className='req';
      const st = r.status || 'pending';
      let badgeHtml = '<span class="badge">รออนุมัติ</span>';
      let actHtml = '<div class="acts"><button class="ok-btn">อนุมัติ</button><button class="no-btn">ปฏิเสธ</button></div>';
      if(st==='approved'){
        badgeHtml = '<span class="badge got">✓ อนุมัติแล้ว</span>';
        actHtml = '<div class="acts"><button class="no-btn" style="opacity:.65">ยกเลิกอนุมัติ</button></div>';
      } else if(st==='rejected'){
        badgeHtml = '<span class="badge rej">✕ ถูกปฏิเสธ</span>';
        actHtml = '<div class="acts"><button class="ok-btn">เปลี่ยนเป็นอนุมัติ</button></div>';
      }

      d.innerHTML='<div class="req-row"><div class="av"></div><div class="rt"><b></b><small></small></div>'+badgeHtml+'</div>'+actHtml;
      d.querySelector('.av').textContent=r.name.charAt(0).toUpperCase();
      d.querySelector('b').textContent=r.name;
      d.querySelector('small').textContent=new Date(r.time).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});

      const okBtn = d.querySelector('.ok-btn');
      if(okBtn) okBtn.onclick=()=>decideRequest(r.id, r.name, 'approved');
      const noBtn = d.querySelector('.no-btn');
      if(noBtn) noBtn.onclick=()=>decideRequest(r.id, r.name, 'rejected');

      box.appendChild(d);
    });
  }
  async function decideRequest(id, name, status){
    try{
      const res = await fetch('/api/requests/decide',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id, name, status})
      });
      if(res.ok && status==='approved') showToast('✓ อนุมัติลูกค้าสำเร็จ!');
      else if(res.ok && status==='rejected') showToast('ปฏิเสธคำขอเรียบร้อย');
    }catch(e){}
    loadStatus();
  }
  async function addCustomer(){
    const name=prompt('กรอกชื่อลูกค้าที่ต้องการเพิ่ม (จะได้รับการอนุมัติทันที):');
    if(!name || !name.trim()) return;
    try{
      const r=await fetch('/api/requests/add',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name: name.trim()})
      });
      if(r.ok){
        alert('เพิ่มลูกค้า "'+name.trim()+'" สำเร็จและอนุมัติเรียบร้อย');
        if(document.getElementById('statusView').style.display!=='none') loadStatus();
      }
    }catch(e){
      alert('เกิดข้อผิดพลาดในการเพิ่มลูกค้า');
    }
  }
  function openStatus(){
    document.getElementById('homeMenu').style.display='none';
    document.getElementById('statusView').style.display='flex';
    loadStatus();
    statusTimer=setInterval(loadStatus,3000);
  }
  function closeStatus(){
    clearInterval(statusTimer);
    document.getElementById('statusView').style.display='none';
    document.getElementById('homeMenu').style.display='flex';
  }
  function login(){
    if(document.getElementById('pw').value.trim()==='ร้านขายเอมเม่'){
      show('adminOk');
      setTimeout(()=>show('main'),1500);
    } else document.getElementById('err').textContent='ข้อความไม่ถูกต้อง';
  }
  function tab(name){
    document.querySelectorAll('#main .page').forEach(p=>p.classList.toggle('on',p.id==='p-'+name));
    document.querySelectorAll('#main .tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
    if(name==='quest') loadQuests();
  }
  async function loadMyQuests(){
    const box=document.getElementById('myQuests');
    const me=document.getElementById('custName').textContent;
    let list=[],claims=[],credit=0;
    try{
      const q=await (await fetch('/api/quests',{cache:'no-store'})).json();
      claims=(await (await fetch('/api/claims',{cache:'no-store'})).json()).filter(c=>c.name===me);
      credit=(await (await fetch('/api/balance?name='+encodeURIComponent(me),{cache:'no-store'})).json()).credit;
      list=q.filter(x=>x.assignees.includes(me)).reverse();
    }catch(e){ box.innerHTML='<div class="empty">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>'; return; }
    document.getElementById('myCredit').textContent=credit;
    box.innerHTML=list.length?'':'<div class="empty">ยังไม่มีภารกิจ</div>';
    list.forEach(q=>{
      const mine=claims.filter(c=>c.questId===q.id);
      const last=mine[mine.length-1];
      const st=last?last.status:'none';
      const d=document.createElement('div');
      d.className='qcard';
      d.innerHTML='<div class="qtop"><b>'+esc(q.title)+'</b><span class="credit">🪙 '+q.credit+'</span></div>'
        +(q.desc?'<p>'+esc(q.desc)+'</p>':'')+'<div class="qact"></div>';
      const act=d.querySelector('.qact');
      if(st==='pending') act.innerHTML='<span class="badge">รอแอดมินอนุมัติ</span>';
      else if(st==='approved') act.innerHTML='<span class="badge got">✓ อนุมัติเควสสำเร็จ (+🪙 '+q.credit+')</span>';
      else{
        if(st==='rejected') act.innerHTML='<span class="badge rej">ถูกปฏิเสธ</span> ';
        const b=document.createElement('button');
        b.className='claim-btn'; b.textContent='รับภารกิจ';
        b.onclick=async()=>{
          b.disabled=true; b.textContent='กำลังส่ง...';
          try{ await fetch('/api/claims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questId:q.id,name:me})}); }catch(e){}
          loadMyQuests();
        };
        act.appendChild(b);
      }
      box.appendChild(d);
    });
  }
  setInterval(()=>{
    const home=document.getElementById('c-home');
    if(document.getElementById('custMain').classList.contains('active') && home.classList.contains('on')) loadMyQuests();
  },5000);
  function ctab(name){
    if(name==='home') loadMyQuests();
    document.querySelectorAll('#custMain .page').forEach(p=>p.classList.toggle('on',p.id==='c-'+name));
    document.querySelectorAll('#custMain .tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  }
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  async function loadQuests(){
    const box=document.getElementById('questList');
    const cbox=document.getElementById('claimList');
    const abox=document.getElementById('approvedClaimList');
    let list=[],allClaims=[];
    try{
      list=(await (await fetch('/api/quests',{cache:'no-store'})).json()).reverse();
      allClaims=await (await fetch('/api/claims',{cache:'no-store'})).json();
    }catch(e){ box.innerHTML='<div class="empty">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>'; return; }
    const pendingClaims = allClaims.filter(c=>c.status==='pending').reverse();
    const approvedClaims = allClaims.filter(c=>c.status==='approved').slice(-5).reverse();
    cbox.innerHTML='';
    if(pendingClaims.length){
      const h=document.createElement('b'); h.className='lbl'; h.textContent='คำขอรับเครดิต ('+pendingClaims.length+')'; cbox.appendChild(h);
    }
    pendingClaims.forEach(c=>{
      const d=document.createElement('div');
      d.className='qcard claim';
      d.innerHTML='<div class="qtop"><b></b><span class="credit"></span></div><div class="who"></div>'
        +'<div class="acts"><button class="ok-btn">อนุมัติ</button><button class="no-btn">ปฏิเสธ</button></div>';
      d.querySelector('b').textContent=c.title;
      d.querySelector('.credit').textContent='🪙 '+c.credit;
      d.querySelector('.who').textContent='ขอโดย: '+c.name;
      d.querySelector('.ok-btn').onclick=()=>decideClaim(c.id,'approved',c.name);
      d.querySelector('.no-btn').onclick=()=>decideClaim(c.id,'rejected',c.name);
      cbox.appendChild(d);
    });
    box.innerHTML=list.length?'':'<div class="empty">ยังไม่มีภารกิจ</div>';
    list.forEach(q=>{
      const d=document.createElement('div');
      d.className='qcard';
      d.innerHTML='<div class="qtop"><b>'+esc(q.title)+'</b><span class="credit">🪙 '+q.credit+'</span></div>'
        +(q.desc?'<p>'+esc(q.desc)+'</p>':'')
        +'<div class="who">ส่งให้: '+(q.assignees.length?q.assignees.map(a=>'<span class="chip">'+esc(a)+'</span>').join(''):'<i>ยังไม่เลือก</i>')+'</div>';
      box.appendChild(d);
    });
    if(abox){
      abox.innerHTML='';
      if(approvedClaims.length){
        const ah=document.createElement('b'); ah.className='lbl'; ah.textContent='อนุมัติเควสสำเร็จล่าสุด ('+approvedClaims.length+')'; abox.appendChild(ah);
        approvedClaims.forEach(c=>{
          const ad=document.createElement('div');
          ad.className='qcard';
          ad.style.borderLeft='4px solid #22c58b';
          ad.innerHTML='<div class="qtop"><b>'+esc(c.title)+'</b><span class="badge got">✓ อนุมัติเควสสำเร็จ</span></div><div class="who">'+esc(c.name)+' ได้รับ 🪙 '+c.credit+' เครดิต</div>';
          abox.appendChild(ad);
        });
      }
    }
  }
  async function decideClaim(id,status,who){
    try{
      const res=await fetch('/api/claims/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
      if(res.ok && status==='approved'){
        showToast('✓ อนุมัติเควสสำเร็จ!'+(who?' ('+who+')':''));
      } else if(res.ok && status==='rejected'){
        showToast('ปฏิเสธคำขอเรียบร้อย');
      }
    }catch(e){}
    loadQuests();
  }
  setInterval(()=>{
    if(document.getElementById('main').classList.contains('active')
      && document.getElementById('p-quest').classList.contains('on')
      && document.getElementById('questMain').style.display!=='none') loadQuests();
  },5000);
  async function openQuestForm(){
    document.getElementById('questMain').style.display='none';
    document.getElementById('questForm').style.display='flex';
    ['qTitle','qDesc','qCredit'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('qErr').textContent='';
    const box=document.getElementById('custList');
    box.innerHTML='<div class="empty">กำลังโหลด...</div>';
    let names=[];
    try{
      const allReqs = await (await fetch('/api/requests',{cache:'no-store'})).json();
      names=[...new Set(allReqs.filter(r=>r.status==='approved'||!r.status).map(r=>r.name))];
    }catch(e){}
    box.innerHTML=names.length?'':'<div class="empty">ยังไม่มีลูกค้า</div>';
    names.forEach(n=>{
      const l=document.createElement('label');
      l.className='cust';
      l.innerHTML='<input type="checkbox" value=""><span></span>';
      l.querySelector('input').value=n;
      l.querySelector('span').textContent=n;
      box.appendChild(l);
    });
  }
  function toggleAll(on){ document.querySelectorAll('#custList input').forEach(c=>c.checked=on); }
  function closeQuestForm(){
    document.getElementById('questForm').style.display='none';
    document.getElementById('questMain').style.display='flex';
    loadQuests();
  }
  let savingQ=false;
  async function saveQuest(){
    if(savingQ) return;
    const title=document.getElementById('qTitle').value.trim();
    const err=document.getElementById('qErr');
    if(!title){ err.textContent='กรุณาใส่ชื่อรายการ'; return; }
    const assignees=[...document.querySelectorAll('#custList input:checked')].map(c=>c.value);
    savingQ=true;
    const btn=document.getElementById('qSave');
    btn.disabled=true; btn.textContent='กำลังบันทึก...';
    try{
      const r=await fetch('/api/quests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        title,desc:document.getElementById('qDesc').value,credit:document.getElementById('qCredit').value,assignees})});
      if(!r.ok) throw 0;
      closeQuestForm();
    }catch(e){ err.textContent='บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'; }
    finally{ savingQ=false; btn.disabled=false; btn.textContent='บันทึกภารกิจ'; }
  }
  document.getElementById('questMain') && loadQuests();
</script>
</body>
</html>
